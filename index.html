<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="appstyle">/* Layout: holographic archive terminal — 3D void with a scan grid, targeting reticle locked on the artwork, telemetry in the corners. Single dark look by design. */
:root {
  color-scheme: dark;
  --void: #000307;
  --holo: #7fe9ff;
  --holo-2: #2fb8ff;
  --ink: #e9fbff;
  --dim: #5f8597;
  --line: rgba(127,233,255,.38);
  --glass: rgba(4,22,34,.55);
  --warn: #ffb347;
  --deny: #ff3d63;
  --ok: #6dffb4;
  --display: "Chakra Petch", "Exo 2", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: var(--ink); font-family: var(--display); -webkit-tap-highlight-color: transparent; }
#frame { position: fixed; left: 50%; top: 50%; width: min(100vw, calc(100dvh * 9 / 16)); aspect-ratio: 9 / 16; transform: translate(-50%, -50%); overflow: hidden; container-type: size; background: var(--void); touch-action: none; user-select: none; -webkit-user-select: none; }
@media (max-aspect-ratio: 9/16) { #frame { width: 100vw; height: 100dvh; aspect-ratio: auto; } }
#bg { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 38%, #031a2a 0%, #010a12 45%, var(--void) 80%); }
#stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
/* screen treatment: scanlines + vignette + slow sweep */
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; background:
  repeating-linear-gradient(0deg, rgba(127,233,255,.035) 0 1px, transparent 1px 3px),
  radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.75) 100%); }
#fx::after { content: ""; position: absolute; left: 0; right: 0; height: 18cqh; top: -20cqh; background: linear-gradient(180deg, transparent, rgba(127,233,255,.06), transparent); animation: sweep 7s linear infinite; }
@keyframes sweep { to { top: 110cqh; } }
.hud { position: absolute; pointer-events: none; transition: opacity .6s ease; }
.hud button, .hud a { pointer-events: auto; }
#frame.intro .hud, #frame.gate .hud, #frame.travel .hud { opacity: 0; }
#frame.intro .hud *, #frame.gate .hud *, #frame.travel .hud *, #frame.detail .menu-only, #frame.detail .menu-only * { pointer-events: none !important; }
.mono { font-family: var(--mono); }
/* screen corner brackets */
.corner { position: absolute; width: 7cqw; height: 7cqw; border: 1.5px solid var(--holo); opacity: .55; z-index: 4; pointer-events: none; }
.corner.tl { left: 3cqw; top: 2.2cqh; border-right: 0; border-bottom: 0; } .corner.tr { right: 3cqw; top: 2.2cqh; border-left: 0; border-bottom: 0; }
.corner.bl { left: 3cqw; bottom: 2.2cqh; border-right: 0; border-top: 0; } .corner.br { right: 3cqw; bottom: 2.2cqh; border-left: 0; border-top: 0; }
#top { top: 4.4cqh; left: 7cqw; right: 7cqw; display: flex; justify-content: space-between; align-items: flex-start; gap: 3cqw; }
#top .t1 { font-weight: 600; font-size: 5cqw; letter-spacing: .32em; text-transform: uppercase; text-shadow: 0 0 3cqw rgba(127,233,255,.55); }
#top .t2 { display: block; margin-top: .8cqw; font: 400 2.3cqw/1.3 var(--mono); color: var(--holo); letter-spacing: .14em; }
#count { right: 7cqw; top: 4.6cqh; font: 500 2.6cqw var(--mono); letter-spacing: .2em; color: var(--holo); font-variant-numeric: tabular-nums; text-align: right; }
#count small { display: block; color: var(--dim); font-size: 2.1cqw; margin-top: .8cqw; }
#ticker { left: 3.6cqw; top: 22cqh; bottom: 30cqh; width: 3cqw; font: 400 1.9cqw/1.6 var(--mono); color: var(--dim); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .3em; opacity: .7; overflow: hidden; white-space: nowrap; }
/* targeting reticle */
#reticle { position: absolute; z-index: 2; pointer-events: none; transition: opacity .3s; }
#reticle i { position: absolute; width: 5cqw; height: 5cqw; border: 2px solid var(--holo); filter: drop-shadow(0 0 1.5cqw rgba(127,233,255,.8)); }
#reticle i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; } #reticle i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
#reticle i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; } #reticle i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
#reticle .tag { position: absolute; left: 0; top: -4.6cqw; font: 500 2.2cqw var(--mono); letter-spacing: .2em; color: var(--holo); white-space: nowrap; }
#reticle .tag2 { position: absolute; right: 0; bottom: -4.4cqw; font: 400 2cqw var(--mono); letter-spacing: .14em; color: var(--dim); white-space: nowrap; }
#reticle.locked i { border-color: var(--deny); filter: drop-shadow(0 0 1.5cqw rgba(255,61,99,.8)); }
#reticle.locked .tag { color: var(--deny); }
#frame.gate #reticle, #frame.intro #reticle, #frame.travel #reticle { opacity: 0; }
/* info panel */
#info { left: 7cqw; right: 7cqw; bottom: 4.6cqh; transition: opacity .3s ease, transform .3s ease; }
#info.out { opacity: 0; transform: translateY(1.2cqh); }
#info .num { font: 500 2.4cqw var(--mono); letter-spacing: .26em; color: var(--holo); }
#info .name { font-weight: 600; font-size: 8cqw; letter-spacing: .04em; text-transform: uppercase; line-height: 1.05; margin-top: 1cqw; text-shadow: 0 0 4cqw rgba(127,233,255,.35); min-height: 1.05em; }
#info .sub { margin-top: 1cqw; font: 400 2.8cqw var(--mono); color: var(--dim); letter-spacing: .06em; }
#info .meta { margin-top: 2.6cqw; display: flex; flex-wrap: wrap; gap: 1.6cqw; }
.chip { font: 500 2.3cqw var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 1.1cqw 2cqw; border: 1px solid var(--line); color: var(--ink); background: rgba(127,233,255,.06); display: inline-flex; align-items: center; gap: 1.4cqw; clip-path: polygon(0 0, calc(100% - 1.4cqw) 0, 100% 1.4cqw, 100% 100%, 1.4cqw 100%, 0 calc(100% - 1.4cqw)); }
.chip.gold { border-color: rgba(255,179,71,.6); color: var(--warn); }
.chip .dot { width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: currentColor; box-shadow: 0 0 2cqw currentColor; animation: blink 1.6s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .25; } }
#info .hint { margin-top: 2.4cqw; font: 400 2.8cqw/1.5 var(--mono); color: #bfeffd; border-left: 2px solid var(--deny); padding-left: 2.4cqw; }
.actions { margin-top: 3.6cqw; display: flex; flex-wrap: wrap; gap: 2.2cqw; }
.btn { font: 600 3.2cqw var(--display); letter-spacing: .14em; text-transform: uppercase; padding: 2.4cqw 4.4cqw; border: 1px solid var(--holo); background: rgba(127,233,255,.08); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 1.6cqw; clip-path: polygon(0 0, calc(100% - 2.4cqw) 0, 100% 2.4cqw, 100% 100%, 2.4cqw 100%, 0 calc(100% - 2.4cqw)); transition: background .2s, color .2s; }
.btn.primary { background: var(--holo); color: #001018; border-color: var(--holo); box-shadow: 0 0 5cqw rgba(127,233,255,.45); }
.btn:hover { background: rgba(127,233,255,.2); } .btn.primary:hover { background: #b6f4ff; }
.btn:focus-visible, .arrow:focus-visible, #gear:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.arrow { position: absolute; top: 44%; width: 9cqw; height: 12cqw; border: 1px solid var(--line); background: var(--glass); color: var(--holo); font: 500 5cqw/1 var(--mono); cursor: pointer; display: grid; place-items: center; transition: opacity .3s; clip-path: polygon(30% 0, 100% 0, 100% 100%, 30% 100%, 0 50%); }
#next { clip-path: polygon(0 0, 70% 0, 100% 50%, 70% 100%, 0 100%); }
.arrow[disabled] { opacity: 0; pointer-events: none; }
#prev { left: 2.4cqw; } #next { right: 2.4cqw; }
#swipehint { left: 0; right: 0; top: 16.4cqh; text-align: center; font: 400 2.3cqw var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
#swipehint.gone { opacity: 0; }
/* detail */
#detailbar { position: absolute; top: 4.2cqh; left: 7cqw; right: 7cqw; display: flex; align-items: center; gap: 4cqw; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
#detailbar .dt { display: flex; flex-direction: column; }
#detailbar .dt b { font-weight: 600; font-size: 4.4cqw; letter-spacing: .1em; text-transform: uppercase; }
#detailbar .dt small { font: 400 2.2cqw var(--mono); color: var(--holo); letter-spacing: .16em; }
#readout { position: absolute; right: 7cqw; top: 12.5cqh; text-align: right; font: 400 2.2cqw/1.7 var(--mono); color: var(--holo); letter-spacing: .12em; opacity: 0; transition: opacity .45s; pointer-events: none; font-variant-numeric: tabular-nums; }
#dbottom { position: absolute; left: 7cqw; right: 7cqw; bottom: 4.6cqh; display: flex; flex-direction: column; align-items: stretch; gap: 2.6cqw; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
#dbottom small { font: 400 2.2cqw var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); text-align: center; }
#dbottom .btn { align-self: center; }
#about { padding: 3cqw 3.6cqw; border: 1px solid var(--line); background: rgba(0,12,20,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); clip-path: polygon(0 0, calc(100% - 3cqw) 0, 100% 3cqw, 100% 100%, 0 100%); }
#about b { display: block; font: 500 2.2cqw var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--holo); margin-bottom: 1.4cqw; }
#about p { margin: 0; font-size: 3.2cqw; font-weight: 400; line-height: 1.45; color: #d6f6ff; }
#frame.detail #top, #frame.detail #info, #frame.detail #count, #frame.detail .arrow, #frame.detail #swipehint, #frame.detail #ticker, #frame.detail #tools { opacity: 0; }
#frame.detail #detailbar, #frame.detail #dbottom, #frame.detail #readout { opacity: 1; }
#frame.detail #detailbar button, #frame.detail #dbottom a { pointer-events: auto; }
/* intro + gate */
#blackout { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
#intro-ui { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#ihud { position: absolute; left: 7cqw; right: 7cqw; top: 6cqh; z-index: 5; font: 400 2.4cqw/1.8 var(--mono); color: var(--holo); letter-spacing: .14em; opacity: 0; transition: opacity .6s; pointer-events: none; text-shadow: 0 0 2cqw rgba(127,233,255,.6); font-variant-numeric: tabular-nums; }
#ihud b { display: block; font: 600 4.6cqw var(--display); letter-spacing: .24em; color: var(--ink); }
#ihud .bar { margin-top: 1.6cqw; height: 2px; background: rgba(127,233,255,.2); } #ihud .bar i { display: block; height: 100%; width: 0; background: var(--holo); box-shadow: 0 0 2cqw var(--holo); }
#frame.intro #ihud { opacity: 1; }
#skip { position: absolute; right: 7cqw; bottom: 5cqh; z-index: 6; opacity: 0; pointer-events: none; transition: opacity .6s; }
#frame.intro #skip { opacity: .9; pointer-events: auto; }
#gate { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6cqw; padding: 0 8cqw; text-align: center; transition: opacity .8s ease, transform 1.2s cubic-bezier(.5,0,.8,.3); }
#gate .k { font: 500 2.4cqw var(--mono); letter-spacing: .5em; color: var(--holo); }
#gate h1 { margin: 0; font-weight: 600; font-size: 9cqw; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 0 5cqw rgba(127,233,255,.5); }
#gate .boot { width: 62cqw; font: 400 2.3cqw/1.7 var(--mono); color: var(--dim); text-align: left; min-height: 9em; letter-spacing: .06em; }
#gate .boot b { color: var(--holo); font-weight: 400; }
#gate .btn { margin-top: 2cqw; font-size: 3.6cqw; padding: 3cqw 6.4cqw; }
#gate .btn[disabled] { opacity: .35; pointer-events: none; }
#gate small { font: 400 2.2cqw var(--mono); color: var(--dim); letter-spacing: .2em; text-transform: uppercase; }
/* glitch + denial */
#frame.glitch #stage { animation: gl .32s steps(3) 1; }
#frame.glitch .hud .name, #frame.glitch #top .t1 { animation: glt .32s steps(4) 1; }
@keyframes gl { 0% { transform: translate(1.5cqw, 0); filter: hue-rotate(40deg) contrast(1.5); } 33% { transform: translate(-1.2cqw, .4cqw); } 66% { transform: translate(.6cqw, -.4cqw); filter: none; } 100% { transform: none; } }
@keyframes glt { 0% { text-shadow: 2px 0 var(--deny), -2px 0 var(--holo); transform: translateX(3px); } 50% { text-shadow: -3px 0 var(--deny), 3px 0 var(--holo); transform: translateX(-2px); } 100% { text-shadow: none; transform: none; } }
#deny { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; background: repeating-linear-gradient(0deg, rgba(255,61,99,.16) 0 2px, transparent 2px 6px); }
#frame.denied #deny { animation: den .9s ease-out 1; }
@keyframes den { 0% { opacity: 1; } 100% { opacity: 0; } }
#toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.96); padding: 3cqw 5cqw; background: rgba(0,6,12,.9); border: 1px solid var(--line); font: 500 3cqw/1.5 var(--mono); letter-spacing: .12em; text-align: center; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 8; max-width: 80cqw; clip-path: polygon(0 0, calc(100% - 3cqw) 0, 100% 3cqw, 100% 100%, 3cqw 100%, 0 calc(100% - 3cqw)); }
#toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#toast.deny { border-color: var(--deny); color: #ffd6de; }
#toast b { display: block; color: var(--deny); font-size: 4cqw; letter-spacing: .3em; margin-bottom: 1cqw; }
#tools { left: 7cqw; top: 11.2cqh; display: flex; gap: 1.6cqw; z-index: 6; }
.tool { font: 500 2.1cqw var(--mono); letter-spacing: .16em; color: var(--holo); background: rgba(127,233,255,.06); border: 1px solid var(--line); padding: 1.2cqw 2cqw; cursor: pointer; }
.tool[aria-pressed="false"] { color: var(--dim); }
.tool:focus-visible, .tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#panel { position: absolute; inset: 0; z-index: 9; background: rgba(0,4,9,.95); display: flex; flex-direction: column; padding: 6cqh 7cqw 5cqh; gap: 4cqw; overflow-y: auto; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
#panel h2 { margin: 0; font-weight: 600; font-size: 5.4cqw; letter-spacing: .2em; text-transform: uppercase; color: var(--holo); }
#panel p { margin: 0; color: var(--dim); font: 400 2.9cqw/1.5 var(--mono); }
#panel fieldset { border: 1px solid var(--line); padding: 3cqw 4cqw; margin: 0; display: flex; flex-direction: column; gap: 2.4cqw; }
#panel legend { padding: 0 1.4cqw; font-weight: 600; font-size: 3.6cqw; letter-spacing: .08em; }
#panel label { font: 400 2.8cqw var(--mono); color: var(--dim); display: flex; flex-direction: column; gap: 1.2cqw; }
#panel select, #panel input { font: 400 3.6cqw var(--mono); color: var(--ink); background: #011522; border: 1px solid var(--line); padding: 2cqw 2.6cqw; }
#panel .row { display: flex; gap: 2.4cqw; flex-wrap: wrap; margin-top: 1cqw; }
#panel .msg { min-height: 1.5em; font: 400 2.9cqw var(--mono); color: var(--holo); }
@media (prefers-reduced-motion: reduce) { #fx::after, .chip .dot { animation: none; } #frame.glitch #stage, #frame.glitch .hud .name { animation: none; } }

#info .countdown { margin-top: 2.4cqw; font: 600 4.4cqw var(--mono); letter-spacing: .1em; color: var(--deny); text-shadow: 0 0 3cqw rgba(255,61,99,.6); font-variant-numeric: tabular-nums; }
#info .countdown small { display: block; font: 400 2.2cqw var(--mono); letter-spacing: .24em; color: var(--dim); text-shadow: none; margin-bottom: .6cqw; }
#about .tabs { display: flex; gap: 3cqw; margin-bottom: 1.8cqw; border-bottom: 1px solid var(--line); }
.tab { font: 500 2.2cqw var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); background: none; border: 0; padding: 0 0 1.4cqw; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--holo); border-bottom-color: var(--holo); }
#comp { display: grid; grid-template-columns: auto 1fr auto; gap: 1.2cqw 2.4cqw; align-items: center; font: 400 2.5cqw var(--mono); color: #d6f6ff; font-variant-numeric: tabular-nums; }
#comp .die { width: 4.2cqw; height: 4.2cqw; display: block; }
#comp .note .die { display: inline-block; width: 2.6cqw; height: 2.6cqw; vertical-align: -.5cqw; }
#comp .bar { height: 1.6cqw; background: rgba(127,233,255,.12); position: relative; }
#comp .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--holo-2), var(--holo)); box-shadow: 0 0 2cqw rgba(127,233,255,.5); transition: width .9s cubic-bezier(.2,.8,.2,1); }
#comp .note { grid-column: 1 / -1; color: var(--dim); font-size: 2.2cqw; letter-spacing: .08em; margin-top: .6cqw; }
#dbottom .drow { display: flex; gap: 2.4cqw; justify-content: center; flex-wrap: wrap; }
#frame.detail #dbottom button { pointer-events: auto; }

.tool.hot { color: var(--warn); border-color: rgba(255,179,71,.65); background: rgba(255,179,71,.08); }
#proc { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqw; background: rgba(0,4,9,.82); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); text-align: center; padding: 0 10cqw; }
#proc .ring { width: 22cqw; height: 22cqw; border-radius: 50%; border: 2px solid rgba(127,233,255,.2); border-top-color: var(--holo); border-right-color: var(--holo); animation: spinr .9s linear infinite; box-shadow: 0 0 6cqw rgba(127,233,255,.25); }
@keyframes spinr { to { transform: rotate(360deg); } }
#proc b { font-weight: 600; font-size: 4.4cqw; letter-spacing: .2em; text-transform: uppercase; }
#proc span { font-size: 3cqw; color: var(--holo); letter-spacing: .2em; }
#proc small { font: 400 2.3cqw var(--mono); color: var(--dim); letter-spacing: .1em; }
@media (prefers-reduced-motion: reduce) { #proc .ring { animation: none; } }

.dsel { margin-top: 2.6cqw; }
.dsel .dl { display: block; font: 500 2.2cqw var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--holo); margin-bottom: 1.4cqw; }
.dopts { display: flex; flex-wrap: wrap; gap: 1.4cqw; }
.dopt { font: 500 2.6cqw var(--mono); letter-spacing: .06em; color: var(--ink); background: rgba(127,233,255,.05); border: 1px solid var(--line); padding: 1.4cqw 2.2cqw; cursor: pointer; font-variant-numeric: tabular-nums; }
.dopt[aria-checked="true"] { background: var(--warn); color: #120800; border-color: var(--warn); box-shadow: 0 0 3cqw rgba(255,179,71,.45); }
.dopt:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.dsel .dinfo { display: block; margin-top: 1.4cqw; font: 400 2.3cqw var(--mono); color: var(--dim); letter-spacing: .06em; }
#send { position: absolute; inset: 0; z-index: 9; background: rgba(0,4,9,.95); display: flex; flex-direction: column; gap: 3cqw; padding: 6cqh 7cqw 5cqh; overflow-y: auto; touch-action: pan-y; }
#send h2 { margin: 0; font-weight: 600; font-size: 5.2cqw; letter-spacing: .18em; text-transform: uppercase; color: var(--holo); }
#send img { width: 100%; max-width: 100%; border: 1px solid var(--line); }
#send ol { margin: 0; padding-left: 5cqw; font: 400 3cqw/1.6 var(--mono); color: #d6f6ff; }
#send .row { display: flex; gap: 2.4cqw; flex-wrap: wrap; }

.dsel .dl2 { margin-top: 1.8cqw; }
.dsel .dopt { padding: 1.2cqw 1.9cqw; font-size: 2.4cqw; }


#langs button { font: 500 2.4cqw var(--mono); letter-spacing: .14em; color: var(--dim); background: rgba(127,233,255,.05); border: 1px solid var(--line); padding: 1.2cqw 2.2cqw; cursor: pointer; }
#langs button[aria-pressed="true"] { color: #001018; background: var(--holo); border-color: var(--holo); }
#langs button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

#stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
#frame.travel #gate { opacity: 0; transform: scale(1.4); pointer-events: none; }
